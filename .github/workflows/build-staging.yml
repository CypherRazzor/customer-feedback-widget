name: Build and deploy to staging (DIG-2660)

on:
  push:
    branches: [feat/DIG-74-feedback-widget]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/cypherrazzor/customer-feedback-widget:staging
            ghcr.io/cypherrazzor/customer-feedback-widget:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify force deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_API_URL }}
          APP_UUID: ${{ secrets.CFW_STAGING_APP_UUID }}
        run: |
          echo "Triggering Coolify deploy for app $APP_UUID"
          RESULT=$(curl -sf -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            "$COOLIFY_URL/api/v1/applications/$APP_UUID/deploy" \
            -d '{"force": true}' 2>&1) || { echo "Deploy trigger failed: $RESULT"; exit 1; }
          echo "Deploy queued: $RESULT"
          DEPLOY_UUID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployment_uuid',''))" 2>/dev/null || echo "")
          echo "Deployment UUID: $DEPLOY_UUID"

      - name: Wait and verify health
        run: |
          echo "Waiting 120s for container to start..."
          sleep 120
          HEALTH_URL="https://duahe1wymadv6xe2in3xh6vd.moncala.digitalesgeschaeft.de/api/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" 2>/dev/null || echo "error")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED"
              exit 0
            fi
            sleep 20
          done
          echo "Health check FAILED after all retries — check Coolify deploy logs"
          exit 1
